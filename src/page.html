<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello from Ebersberg</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f1;
        --card: #ffffff;
        --text: #1c1b19;
        --muted: #6b6860;
        --border: #dedbd2;
        --accent: #1f6f4a;
        --accent-text: #ffffff;
        --danger: #b3261e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161614;
          --card: #21201d;
          --text: #f1efe9;
          --muted: #a19d93;
          --border: #38362f;
          --accent: #4fb586;
          --accent-text: #0d1f16;
          --danger: #f2877f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 16px 64px;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 24px;
        font-size: 2rem;
      }
      h2 {
        margin: 40px 0 12px;
        font-size: 1.15rem;
      }
      button,
      .file-button {
        display: inline-block;
        padding: 10px 18px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        font-weight: 600;
      }
      button.danger {
        padding: 6px 12px;
        color: var(--danger);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #camera {
        margin-top: 16px;
      }
      video {
        display: block;
        width: 100%;
        max-height: 70vh;
        margin-bottom: 12px;
        border-radius: 12px;
        background: #000;
      }
      #status {
        min-height: 1.5em;
        margin: 12px 0 0;
        color: var(--muted);
      }
      #status.error {
        color: var(--danger);
      }
      #gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      #gallery li {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--card);
      }
      #gallery img {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
      }
      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      #empty {
        color: var(--muted);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello from Ebersberg</h1>

      <div class="actions">
        <button id="open" class="primary" type="button">Kamera öffnen</button>
        <label id="file-label" class="file-button" hidden>
          Foto auswählen
          <input id="file" type="file" accept="image/*" capture="environment" hidden />
        </label>
      </div>

      <div id="camera" hidden>
        <video id="video" autoplay playsinline muted></video>
        <div class="actions">
          <button id="capture" class="primary" type="button">Foto aufnehmen</button>
          <button id="cancel" type="button">Abbrechen</button>
        </div>
      </div>

      <p id="status" role="status"></p>

      <h2>Hochgeladene Fotos</h2>
      <p id="empty" hidden>Noch keine Fotos.</p>
      <ul id="gallery"></ul>
    </main>

    <script>
      const MAX_EDGE = 1600
      const openBtn = document.getElementById('open')
      const fileLabel = document.getElementById('file-label')
      const fileInput = document.getElementById('file')
      const camera = document.getElementById('camera')
      const video = document.getElementById('video')
      const captureBtn = document.getElementById('capture')
      const cancelBtn = document.getElementById('cancel')
      const statusEl = document.getElementById('status')
      const gallery = document.getElementById('gallery')
      const empty = document.getElementById('empty')
      let stream = null

      function setStatus(text, isError) {
        statusEl.textContent = text
        statusEl.classList.toggle('error', Boolean(isError))
      }

      function stopCamera() {
        if (stream) stream.getTracks().forEach((track) => track.stop())
        stream = null
        video.srcObject = null
        camera.hidden = true
        openBtn.hidden = false
      }

      async function openCamera() {
        setStatus('')
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fileLabel.hidden = false
          setStatus('Dieser Browser erlaubt keinen direkten Kamerazugriff. Nutze „Foto auswählen".', true)
          return
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false,
          })
        } catch (err) {
          fileLabel.hidden = false
          const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError')
          setStatus(
            denied
              ? 'Kamerazugriff wurde nicht erlaubt. Erlaube ihn im Browser oder nutze „Foto auswählen".'
              : 'Keine Kamera gefunden. Nutze „Foto auswählen".',
            true
          )
          return
        }
        video.srcObject = stream
        camera.hidden = false
        openBtn.hidden = true
      }

      // Scales the source down to MAX_EDGE and re-encodes it as JPEG.
      function toJpeg(source, width, height) {
        const scale = Math.min(1, MAX_EDGE / Math.max(width, height))
        const canvas = document.createElement('canvas')
        canvas.width = Math.round(width * scale)
        canvas.height = Math.round(height * scale)
        canvas.getContext('2d').drawImage(source, 0, 0, canvas.width, canvas.height)
        return new Promise((resolve, reject) => {
          canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error('encode failed'))), 'image/jpeg', 0.85)
        })
      }

      async function upload(blob) {
        setStatus('Foto wird hochgeladen …')
        const res = await fetch('/api/photos', {
          method: 'POST',
          headers: { 'Content-Type': blob.type },
          body: blob,
        })
        const data = await res.json().catch(() => ({}))
        if (!res.ok) throw new Error(data.error || 'Upload fehlgeschlagen.')
        gallery.prepend(renderPhoto(data))
        empty.hidden = true
        setStatus('Foto hochgeladen.')
      }

      async function capture() {
        if (!video.videoWidth) return
        captureBtn.disabled = true
        try {
          const blob = await toJpeg(video, video.videoWidth, video.videoHeight)
          stopCamera()
          await upload(blob)
        } catch (err) {
          setStatus(err.message || 'Upload fehlgeschlagen.', true)
        } finally {
          captureBtn.disabled = false
        }
      }

      async function uploadFile() {
        const file = fileInput.files[0]
        fileInput.value = ''
        if (!file) return
        try {
          const bitmap = await createImageBitmap(file)
          const blob = await toJpeg(bitmap, bitmap.width, bitmap.height)
          await upload(blob)
        } catch (err) {
          setStatus(err.message || 'Dieses Bild konnte nicht gelesen werden.', true)
        }
      }

      function renderPhoto(photo) {
        const li = document.createElement('li')

        const link = document.createElement('a')
        link.href = photo.url
        link.target = '_blank'
        link.rel = 'noopener'
        const img = document.createElement('img')
        img.src = photo.url
        img.alt = 'Hochgeladenes Foto'
        img.loading = 'lazy'
        link.append(img)

        const meta = document.createElement('div')
        meta.className = 'meta'
        const time = document.createElement('span')
        time.textContent = photo.uploadedAt ? new Date(photo.uploadedAt).toLocaleString('de-DE') : ''
        const remove = document.createElement('button')
        remove.type = 'button'
        remove.className = 'danger'
        remove.textContent = 'Löschen'
        remove.addEventListener('click', () => removePhoto(photo.id, li, remove))
        meta.append(time, remove)

        li.append(link, meta)
        return li
      }

      async function removePhoto(id, li, button) {
        if (!confirm('Dieses Foto wirklich löschen?')) return
        button.disabled = true
        try {
          const res = await fetch('/api/photos/' + encodeURIComponent(id), { method: 'DELETE' })
          if (!res.ok) throw new Error()
          li.remove()
          empty.hidden = gallery.children.length > 0
          setStatus('Foto gelöscht.')
        } catch {
          button.disabled = false
          setStatus('Löschen fehlgeschlagen.', true)
        }
      }

      async function loadPhotos() {
        try {
          const res = await fetch('/api/photos')
          if (!res.ok) throw new Error()
          const data = await res.json()
          gallery.replaceChildren(...data.photos.map(renderPhoto))
          empty.hidden = data.photos.length > 0
        } catch {
          setStatus('Fotos konnten nicht geladen werden.', true)
        }
      }

      openBtn.addEventListener('click', openCamera)
      captureBtn.addEventListener('click', capture)
      cancelBtn.addEventListener('click', stopCamera)
      fileInput.addEventListener('change', uploadFile)
      loadPhotos()
    </script>
  </body>
</html>
